<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Profile · APISec Lab', 'profile', ~{::section})}">
<body>
<section>
    <h1>Profile</h1>
    <p style="color:var(--muted);">Protected page. Identity comes from the authenticated JWT principal.</p>
    <dl class="profile-grid">
        <dt>Name</dt>
        <dd th:text="${currentUser.name}">Name</dd>
        <dt>Email</dt>
        <dd th:text="${currentUser.email}">email</dd>
        <dt>Role</dt>
        <dd th:text="${currentUser.role}">STUDENT</dd>
        <dt>Created at</dt>
        <dd th:text="${currentUser.createdAt}">timestamp</dd>
    </dl>
</section>
</body>
</html>
